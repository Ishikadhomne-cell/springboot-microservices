#spring.application.name=jobms
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job
spring.datasource.username=root
spring.datasource.password=IshikaDho@28
spring.jpa.database=MYSQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch.registry=true
# Enable discovery-based URL resolution
spring.cloud.discovery.enabled=true

#Config Server
spring.config.import=configserver:http://localhost:8080/
spring.profiles.active=dev

# Show actual SQL para
#
# meter values
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE